<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mausam</title>
<meta name="description" content="Weather, air quality, farm tips, travel checks and severe weather alerts for cities and towns across India, in 10 Indian languages.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EAF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B161C" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&family=Noto+Sans+Bengali:wght@400;600&family=Noto+Sans+Gujarati:wght@400;600&family=Noto+Sans+Kannada:wght@400;600&family=Noto+Sans+Malayalam:wght@400;600&family=Noto+Sans+Gurmukhi:wght@400;600&display=swap">
<style>
/* Layout: one column on phones; on wide screens the current conditions and
   24-hour strip sit left, the instrument tiles and air quality sit right. */
:root {
  --bg: #EAF0F3;
  --surface: #FFFFFF;
  --surface-2: #F1F5F7;
  --ink: #0F2128;
  --ink-2: #4A5F69;
  --line: #D5DFE4;
  --accent: #C9740A;
  --accent-text: #98550A;
  --cool: #2E86A8;
  --warm: #E4572E;
  --sun: #E9A21B;
  --moon: #8DA2C7;
  --cloud: #A9BCC6;
  --cloud-dark: #6F8693;
  --snow: #BFE3F2;
  --tint-warn: #FCEBD3;
  --tint-info: #DDEEF5;
  --tint-bad: #F8DEDA;
  --good: #2F8F5B;
  --tint-sev1: #FBF1CF;
  --tint-sev2: #FCE6CF;
  --tint-sev3: #F8DCD9;
  --font-display: "Bricolage Grotesque", "Noto Sans Devanagari", system-ui, sans-serif;
  --font-body: "Hanken Grotesk", "Noto Sans Devanagari", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0B161C;
    --surface: #12222A;
    --surface-2: #182B34;
    --ink: #E7EFF2;
    --ink-2: #9DB0B9;
    --line: #243943;
    --accent: #F2A93B;
    --accent-text: #F2A93B;
    --cool: #5BB5D6;
    --warm: #FF7A52;
    --sun: #F5B73E;
    --moon: #B4C4E4;
    --cloud: #7E95A1;
    --cloud-dark: #51666F;
    --snow: #D7EEF8;
    --tint-warn: #3A2A12;
    --tint-info: #12313D;
    --tint-bad: #3C1B18;
    --good: #58C48A;
    --tint-sev1: #3A3210;
    --tint-sev2: #3F2A12;
    --tint-sev3: #421C1C;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.app { max-width: 1080px; margin: 0 auto; padding: 20px 16px 40px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.brand { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; min-width: 0; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; letter-spacing: -0.02em; }
.brand-hi { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; color: var(--accent-text); }
.brand-tag { color: var(--ink-2); font-size: 0.9rem; }
.controls { display: flex; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 3px; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 999px; color: var(--ink-2); font-weight: 600; font-size: 0.9rem; min-width: 44px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* search */
.search-wrap { position: relative; margin-bottom: 12px; }
.search { display: flex; gap: 8px; }
.search input {
  flex: 1; min-width: 0; height: 46px; padding: 0 16px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
}
.search input::placeholder { color: var(--ink-2); }
.btn {
  height: 46px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 600; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.results {
  position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 6px);
  margin: 0; padding: 6px; list-style: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
}
.results button {
  width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 12px; border-radius: 8px;
  display: flex; justify-content: space-between; gap: 12px;
}
.results button:hover, .results button:focus-visible { background: var(--surface-2); }
.results .r-sub { color: var(--ink-2); font-size: 0.9rem; }
.results .r-empty { padding: 10px 12px; color: var(--ink-2); }
.notice { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; background: var(--tint-info); }

/* chips */
.chip-row { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 6px; scrollbar-width: thin; }
.chip-label { flex: 0 0 auto; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); }
.chip {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 14px; font-size: 0.92rem;
}
.chip:hover { border-color: var(--accent); }
.chip[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* cards */
.grid { display: grid; gap: 14px; margin-top: 10px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "alerts" "hero" "stats" "aqi" "hourly" "daily"; }
@media (min-width: 900px) {
  .grid { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); grid-template-areas: "alerts alerts" "hero stats" "hourly stats" "daily aqi"; }
}
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; min-width: 0; }
.card h2 { margin: 0 0 12px; font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); }
.state { text-align: center; padding: 40px 20px; margin-top: 10px; }
.state p { margin: 0 0 14px; }

/* hero */
.hero { grid-area: hero; }
.place { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; letter-spacing: -0.01em; line-height: 1.2; }
.place-sub { color: var(--ink-2); font-weight: 500; font-size: 1rem; margin-left: 8px; }
.updated { margin: 2px 0 0; color: var(--ink-2); font-size: 0.85rem; }
.temp-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 6px; }
.temp { font-family: var(--font-display); font-weight: 700; font-size: clamp(4.6rem, 16vw, 7.6rem); line-height: 0.95; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.temp .unit { font-size: 0.32em; letter-spacing: 0; color: var(--ink-2); margin-left: 4px; vertical-align: top; position: relative; top: 0.35em; }
.hero-icon { width: clamp(84px, 24vw, 128px); flex: 0 0 auto; }
.hero-icon svg { width: 100%; height: auto; display: block; }
.cond { margin: 4px 0 0; font-size: 1.25rem; font-weight: 600; }
.meta { margin: 4px 0 0; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.advice { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.advice li { padding: 7px 12px; border-radius: 10px; font-size: 0.92rem; background: var(--tint-info); }
.advice li.warn { background: var(--tint-warn); }
.advice li.bad { background: var(--tint-bad); }

/* tiles */
.stats { grid-area: stats; align-self: start; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
.tile.wide { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.tile-label { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); margin: 0 0 6px; }
.tile-value { font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; line-height: 1.1; margin: 0; font-variant-numeric: tabular-nums; }
.tile-value small { font-size: 0.5em; font-weight: 500; color: var(--ink-2); margin-left: 3px; }
.tile-sub { margin: 4px 0 0; color: var(--ink-2); font-size: 0.88rem; }
.sun-times { display: flex; gap: 22px; flex-wrap: wrap; }
.arc { width: 92px; flex: 0 0 auto; }
.arc-line { fill: none; stroke: var(--line); stroke-width: 2; stroke-dasharray: 3 3; }
.arc-base { stroke: var(--line); stroke-width: 1.5; }
.arc-dot { fill: var(--sun); }

/* hourly */
.hourly { grid-area: hourly; }
.hours { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.hour { flex: 0 0 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border-radius: 10px; font-variant-numeric: tabular-nums; }
.hour.now { background: var(--surface-2); }
.hour .h-time { font-size: 0.8rem; color: var(--ink-2); }
.hour svg { width: 32px; height: 32px; }
.hour .h-temp { font-weight: 600; }
.hour .h-rain { font-size: 0.78rem; color: var(--cool); min-height: 1.1em; }

/* daily */
.daily { grid-area: daily; }
.days { list-style: none; margin: 0; padding: 0; }
.day { display: grid; grid-template-columns: 4.4rem 28px 2.6rem 2.2rem minmax(40px, 1fr) 2.2rem; gap: 8px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.day:first-child { border-top: 0; }
.day svg { width: 28px; height: 28px; }
.d-name { font-weight: 600; }
.d-rain { font-size: 0.82rem; color: var(--cool); }
.d-lo { text-align: right; color: var(--ink-2); }
.d-hi { text-align: right; font-weight: 600; }
.track { position: relative; height: 6px; border-radius: 999px; background: var(--surface-2); }
.fill { position: absolute; top: 0; bottom: 0; border-radius: 999px; background: linear-gradient(90deg, var(--cool), var(--warm)); }

/* air quality */
.aqi { grid-area: aqi; align-self: start; }
.aqi-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.aqi-num { font-family: var(--font-display); font-weight: 700; font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; }
.aqi-cat { font-weight: 600; }
.scale { position: relative; display: flex; height: 10px; border-radius: 999px; overflow: hidden; margin: 18px 0 8px; }
.scale span { display: block; height: 100%; }
.marker { position: absolute; top: -5px; width: 4px; height: 20px; margin-left: -2px; border-radius: 2px; background: var(--ink); box-shadow: 0 0 0 2px var(--surface); }
.scale-wrap { position: relative; }
.scale-note { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--ink-2); }
.pm { display: flex; gap: 24px; margin-top: 14px; flex-wrap: wrap; }
.pm p { margin: 0; }
.pm .pm-label { font-size: 0.78rem; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.08em; }
.pm .pm-val { font-weight: 600; font-variant-numeric: tabular-nums; }

/* alerts */
.alerts { grid-area: alerts; }
.alerts-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: 12px; }
.alerts-head h2 { margin: 0; }
.alerts-sub { color: var(--ink-2); font-size: 0.85rem; }
.alert-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.alert { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; padding: 12px 14px; border-radius: 12px; background: var(--tint-sev1); }
.alert.l2 { background: var(--tint-sev2); }
.alert.l3 { background: var(--tint-sev3); }
.alert p { margin: 0; }
.alert-title { font-weight: 600; }
.alert-when { margin-left: 8px; color: var(--ink-2); font-weight: 500; }
.alert-detail { margin-top: 2px; font-variant-numeric: tabular-nums; }
.alert-tip { margin-top: 2px; color: var(--ink-2); font-size: 0.92rem; }
.sev { --sev-bg: #E2B93B; display: inline-flex; align-items: center; gap: 6px; align-self: start; padding: 4px 10px; border-radius: 999px; background: var(--sev-bg); color: #231C00; font-size: 0.8rem; font-weight: 600; white-space: nowrap; }
.sev.l2 { --sev-bg: #F28C28; color: #2A1400; }
.sev.l3 { --sev-bg: #C93636; color: #FFFFFF; }
.sev.s { padding: 2px 8px; font-size: 0.75rem; }
.sev .mark { fill: var(--sev-bg); }
.alerts-none { display: flex; align-items: center; gap: 10px; margin: 0; color: var(--ink-2); }
@media (max-width: 520px) { .alert { grid-template-columns: minmax(0, 1fr); } }

/* notifications and watchlist */
.notify { margin-top: 14px; }
.notify h2 { margin-bottom: 4px; }
.nrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 12px 0; border-top: 1px solid var(--line); }
.switch { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; cursor: pointer; }
.switch input { width: 20px; height: 20px; accent-color: var(--accent); }
.n-msg { color: var(--ink-2); font-size: 0.9rem; min-width: 0; }
.select { height: 40px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.n-sub { margin: 14px 0 4px; font-family: var(--font-display); font-size: 1.05rem; }
.watch { list-style: none; margin: 0; padding: 0; }
.w-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.w-row > div { min-width: 0; }
.w-name { border: 0; background: none; padding: 0; font-weight: 600; text-align: left; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.w-sub { margin-left: 8px; color: var(--ink-2); font-size: 0.88rem; }
.w-status { color: var(--ink-2); font-size: 0.88rem; }
.btn-sm { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-size: 0.88rem; }
.btn-sm:hover { border-color: var(--accent); }
.n-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.n-empty { margin: 0 0 4px; color: var(--ink-2); }
.n-foot { margin: 14px 0 0; color: var(--ink-2); font-size: 0.85rem; }

/* icons */
.i-sun { fill: var(--sun); }
.i-ray { stroke: var(--sun); stroke-width: 2.4; stroke-linecap: round; }
.i-moon { fill: var(--moon); }
.i-cloud { fill: var(--cloud); }
.i-cloud-dark { fill: var(--cloud-dark); }
.i-cloud-faint { fill: var(--cloud); opacity: 0.7; }
.i-drop { stroke: var(--cool); stroke-width: 2.6; stroke-linecap: round; fill: none; }
.i-flake { fill: var(--snow); stroke: var(--cloud); stroke-width: 0.8; }
.i-line { stroke: var(--cloud); stroke-width: 2.6; stroke-linecap: round; }
.i-bolt { fill: var(--sun); }

footer { margin-top: 22px; color: var(--ink-2); font-size: 0.85rem; display: flex; flex-direction: column; gap: 4px; }
footer a { color: var(--accent-text); }

/* ===== additions: languages, tabs, skyline, farmer, travel, monsoon ===== */
:root {
  --sky-bg: #D6E0E5;
  --sky-mid: #BCCBD3;
  --sky-lm: #A3B5BF;
  --font-display: "Bricolage Grotesque", "Noto Sans Devanagari", "Noto Sans Tamil", "Noto Sans Telugu", "Noto Sans Bengali", "Noto Sans Gujarati", "Noto Sans Kannada", "Noto Sans Malayalam", "Noto Sans Gurmukhi", system-ui, sans-serif;
  --font-body: "Hanken Grotesk", "Noto Sans Devanagari", "Noto Sans Tamil", "Noto Sans Telugu", "Noto Sans Bengali", "Noto Sans Gujarati", "Noto Sans Kannada", "Noto Sans Malayalam", "Noto Sans Gurmukhi", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --sky-bg: #1B303A; --sky-mid: #274654; --sky-lm: #35525F; }
}
.top { align-items: flex-start; }
.controls { align-items: center; flex-wrap: wrap; }
.lang-select { height: 38px; border-radius: 999px; padding: 0 12px; font-weight: 600; max-width: 150px; }
.brand-tag { flex-basis: 100%; }

/* tabs */
.tabs { display: flex; gap: 6px; overflow-x: auto; margin: 6px 0 4px; padding-bottom: 4px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 1 0 auto; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 8px 16px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink-2); font-weight: 600; white-space: nowrap;
}
.tab svg { width: 18px; height: 18px; flex: 0 0 auto; }
.tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* hero actions and skyline */
.hero { position: relative; overflow: hidden; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.btn-ic {
  display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 8px 14px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); font-weight: 600; font-size: 0.9rem;
}
.btn-ic:hover { border-color: var(--accent); }
.btn-ic svg { width: 18px; height: 18px; flex: 0 0 auto; }
.btn-ic[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.sky { display: block; width: calc(100% + 40px); height: 96px; margin: 14px -20px -18px; }
.sky-far { fill: var(--sky-bg); opacity: .55; }
.sky-bg { fill: var(--sky-bg); }
.sky-near { fill: var(--sky-mid); }
.sky-lm { fill: var(--sky-lm); }
.sky-cut { fill: var(--surface); }
.sky-ln { fill: none; stroke: var(--sky-lm); stroke-width: 2; stroke-linecap: round; }
.sky-water { fill: none; stroke: var(--sky-bg); stroke-width: 2; stroke-linecap: round; }

/* notice inside views */
.banner { margin: 0; padding: 10px 14px; border-radius: 10px; background: var(--tint-info); }
.stack { display: grid; gap: 14px; margin-top: 10px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .stack.two { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.card .lead { margin: 0 0 10px; color: var(--ink-2); font-size: 0.92rem; }
.note { margin: 12px 0 0; color: var(--ink-2); font-size: 0.85rem; }

/* air quality additions */
.aqi-us { margin: 6px 0 0; color: var(--ink-2); font-size: 0.9rem; }
.aqi-main { margin: 2px 0 0; color: var(--ink-2); font-size: 0.9rem; }
.smog { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--tint-warn); font-size: 0.9rem; }

/* farmer */
.win-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.win { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-variant-numeric: tabular-nums; }
.win.best { background: var(--tint-info); }
.win .w-len { color: var(--ink-2); white-space: nowrap; }
.pill { display: inline-block; margin-left: 8px; padding: 1px 9px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; background: var(--ink); color: var(--bg); }
.status-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 10px; }
.chip-s { display: inline-block; padding: 4px 12px; border-radius: 999px; font-weight: 600; background: var(--tint-info); }
.chip-s.warn { background: var(--tint-warn); }
.chip-s.bad { background: var(--tint-bad); }
.chip-s.ok { background: var(--tint-info); }
.soil { margin-top: 16px; }
.soil-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-weight: 600; }
.soil .scale { margin: 10px 0 4px; }
.crop-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.crop-list li { padding: 10px 12px; border-radius: 10px; background: var(--tint-info); }
.crop-list li.warn { background: var(--tint-warn); }
.crop-list li.bad { background: var(--tint-bad); }
.bars { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; height: 150px; }
.bar-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; font-size: 0.78rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.bar { width: 100%; max-width: 34px; border-radius: 6px 6px 2px 2px; background: var(--cool); min-height: 2px; }
.bar-labels { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 6px; text-align: center; font-size: 0.78rem; color: var(--ink-2); }
.big-num { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; margin: 0 0 10px; font-variant-numeric: tabular-nums; }

/* travel */
.tdays { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.tday {
  display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 64px; padding: 8px 2px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 0.78rem; line-height: 1.2; text-align: center;
  overflow-wrap: anywhere;
}
.tday[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink) inset; font-weight: 600; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--good); }
.dot.l1 { background: #E2B93B; }
.dot.l2 { background: #F28C28; }
.dot.l3 { background: #C93636; }
.t-head { display: flex; align-items: center; gap: 10px; margin: 16px 0 0; font-weight: 600; font-size: 1.05rem; }
.t-items { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 10px; }
.t-item { padding: 12px 14px; border-radius: 12px; background: var(--tint-sev1); font-variant-numeric: tabular-nums; }
.t-item.l2 { background: var(--tint-sev2); }
.t-item.l3 { background: var(--tint-sev3); }
.t-item.ok { background: var(--tint-info); display: flex; align-items: center; gap: 10px; }

/* monsoon */
.mon-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
.mon-tiles .tile-value { font-size: 1.45rem; }
.chart { display: block; width: 100%; height: auto; }
.chart .axis { stroke: var(--line); stroke-width: 1; }
.chart .gl { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
.chart .ln-now { fill: none; stroke: var(--cool); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.chart .ln-norm { fill: none; stroke: var(--ink-2); stroke-width: 2; stroke-dasharray: 5 5; }
.chart .area-now { fill: var(--cool); opacity: 0.12; }
.chart text { fill: var(--ink-2); font-size: 10px; font-family: var(--font-body); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 0.88rem; color: var(--ink-2); }
.sw { display: inline-block; width: 20px; height: 0; margin-right: 6px; vertical-align: middle; border-top: 3px solid var(--cool); }
.sw.dash { border-top: 2px dashed var(--ink-2); }
@media (max-width: 520px) { .mon-tiles .tile-value { font-size: 1.15rem; } }

</style>
</head>

  /* ---------- state and storage ---------- */
  const store = {

  /* Saved forecasts, so the app still shows something with no internet. Keeps the 6 most recent places per kind. */
  const cache = {
    get(kind, k) {

    set(kind, k, data) {

      all[k] = { at: Date.now(), data };

  const t = (k, v) => {

    return s;
  };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const locTag = () => (LANG_META.find((l) => l.code === state.lang) || LANG_META[0]).tag;

  /* ---------- formatting ---------- */
  const conv = (c) => (state.unit === "C" ? c : (c * 9) / 5 + 32);
  const degN = (c) => Math.round(conv(c));

  function norm(p) {

  function dayName(i, dateStr) {

  /* Cities that have their own landmark. A place gets it if it is within about 25 km. */
  const LM_POINTS = [
    [28.61, 77.21, "indiagate"], [19.08, 72.88, "gateway"], [17.39, 78.49, "charminar"], [22.57, 88.36, "howrah"],
    [26.91, 75.79, "hawamahal"], [13.08, 80.27, "gopuram"], [12.97, 77.59, "vidhana"], [9.93, 76.27, "nets"],

  function landmarkFor(p) {
    let best = "generic", bestD = 0.25;
    for (const [la, lo, id] of LM_POINTS) {
      const d = Math.hypot(p.lat - la, (p.lon - lo) * Math.cos((la * Math.PI) / 180));
      if (d < bestD) { bestD = d; best = id; }
    }
    return best;
  }

  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  /* Three depth layers: faint far towers, mid buildings with window holes (lit at night), small near houses with trees. */
  function skyBg(seed, c, night) {
    const rnd = rng(seed);
    let far = "", mid = "", win = "", lit = "", near = "";
    let x = -10;
    while (x < 810) {
      const w = 10 + Math.floor(rnd() * 14), h = 30 + Math.floor(rnd() * 42);
      far += `M${x} 112v${-h}h${w}v${h}z`;
      if (rnd() > 0.6) far += `M${x + w / 2 - 1} ${112 - h}v-8h2v8z`;
      x += w + Math.floor(rnd() * 6);
    }
    x = -10;
    while (x < 810) {
      const w = 16 + Math.floor(rnd() * 20);
      let h = 20 + Math.floor(rnd() * 30);
      if (rnd() > 0.8) h += 14;
      if (Math.abs(x + w / 2 - 400) < 90) h = Math.min(h, 14);
      const top = 112 - h, kind = rnd();
      mid += `M${x} 112V${top}h${w}V112z`;
      if (kind < 0.3) mid += `M${x + 2} ${top}v-4h${w - 4}v4z`;                       /* parapet step */
      else if (kind < 0.5) mid += `M${x + 3} ${top}v-6h5v6zM${x + 4} ${top - 6}h3v-3h-3z`; /* water tank */
      else if (kind < 0.62) mid += `M${x + w / 2 - 1} ${top}v-10h2v10z`;              /* antenna */
      if (h > 22 && !(Math.abs(x + w / 2 - 400) < 90)) {
        for (let wy = top + 5; wy < 108; wy += 6) {
          for (let wx = x + 3; wx + 2 <= x + w - 2; wx += 5) {
            const r = `M${wx} ${wy}h2v3h-2z`;
            if (night && rnd() > 0.55) lit += r; else win += r;
          }
        }
      }
      x += w + 1 + Math.floor(rnd() * 4);
    }
    x = -6;
    while (x < 810) {
      if (Math.abs(x - 400) < 110) { x += 18; continue; }
      if (rnd() > 0.6) {
        const r = 5 + Math.floor(rnd() * 3), th = 10 + Math.floor(rnd() * 6);
        near += `M${x - 1} 112v${-th}h2v${th}z` + P.circ(x, 112 - th - r + 2, r);
        x += 12;
      } else {
        const w = 14 + Math.floor(rnd() * 10), h = 8 + Math.floor(rnd() * 8);
        near += `M${x} 112v${-h}l${w / 2} -4l${w / 2} 4v${h}z`;
        x += w + 4;
      }
    }
    return (
      `<path ${c.far} d="${far}"/>` +
      `<path ${c.bg} fill-rule="evenodd" d="${mid}${win}"/>` +
      (lit ? `<path fill="#F5C451" fill-opacity="0.85" d="${lit}"/>` : "") +
      `<path ${c.near} d="${near}M0 111h800v9h-800z"/>`
    );
  }
  /* c holds the style attributes to use: bg (far buildings), lm (landmark fill), ln (line work), g (group extras) */
  function skyInner(place, c, night) {
    const F = (d) => `<path ${c.lm} d="${d}"/>`;
    const E = (d) => `<path ${c.lm} fill-rule="evenodd" d="${d}"/>`;
    const L = (d, w) => `<path ${c.ln}${w ? ` style="stroke-width:${w}"` : ""} d="${d}"/>`;
    const seed = Math.round(place.lat * 100) * 1000 + Math.round(place.lon * 100);
    return `${skyBg(seed, c, night)}<g transform="translate(400 112)" ${c.g || ""}>${LM[landmarkFor(place)](F, E, L)}</g>`;
  }
  const SKY_PAGE = { far: 'class="sky-far"', near: 'class="sky-near"', bg: 'class="sky-bg"', lm: 'class="sky-lm"', ln: 'class="sky-ln"', g: "" };
  const SKY_CARD = { far: 'fill="#fff" fill-opacity="0.07"', near: 'fill="#fff" fill-opacity="0.2"', bg: 'fill="#fff" fill-opacity="0.13"', lm: 'fill="#fff"', ln: 'fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"', g: 'opacity="0.26"' };


  /* ---------- air quality (India AQI, the CPCB method) ---------- */
  /* Each row: concentration from, to, index from, to. PM, NO2 and SO2 are 24-hour averages; ozone and CO are 8-hour averages. */
  const BP = {
    pm25: [[0, 30, 0, 50], [30, 60, 50, 100], [60, 90, 100, 200], [90, 120, 200, 300], [120, 250, 300, 400], [250, 380, 400, 500]],
    pm10: [[0, 50, 0, 50], [50, 100, 50, 100], [100, 250, 100, 200], [250, 350, 200, 300], [350, 430, 300, 400], [430, 510, 400, 500]],
    no2: [[0, 40, 0, 50], [40, 80, 50, 100], [80, 180, 100, 200], [180, 280, 200, 300], [280, 400, 300, 400], [400, 520, 400, 500]],
    so2: [[0, 40, 0, 50], [40, 80, 50, 100], [80, 380, 100, 200], [380, 800, 200, 300], [800, 1600, 300, 400], [1600, 2400, 400, 500]],
    o3: [[0, 50, 0, 50], [50, 100, 50, 100], [100, 168, 100, 200], [168, 208, 200, 300], [208, 748, 300, 400], [748, 1000, 400, 500]],
    co: [[0, 1, 0, 50], [1, 2, 50, 100], [2, 10, 100, 200], [10, 17, 200, 300], [17, 34, 300, 400], [34, 50, 400, 500]]
  };
  const POLL = { pm25: "PM2.5", pm10: "PM10", no2: "NO₂", so2: "SO₂", o3: "O₃", co: "CO" };
  function subIndex(name, c) {
    const rows = BP[name];
    const v = Math.max(0, c);
    for (const [bl, bh, il, ih] of rows) {
      if (v <= bh) return Math.round(il + ((ih - il) * (v - bl)) / (bh - bl));
    }
    return 500;
  }
  function avgLast(arr, endIdx, n, min) {
    if (!arr) return null;
    let s = 0, c = 0;
    for (let i = Math.max(0, endIdx - n + 1); i <= endIdx; i++) {
      const v = arr[i];
      if (typeof v === "number" && isFinite(v)) { s += v; c++; }
    }
    return c >= min ? s / c : null;
  }
  function analyzeAir(raw) {
    if (!raw || !raw.current) return null;
    const cur = raw.current, h = raw.hourly;
    const out = {
      us: typeof cur.us_aqi === "number" ? Math.round(cur.us_aqi) : null,
      pm25: typeof cur.pm2_5 === "number" ? cur.pm2_5 : null,
      pm10: typeof cur.pm10 === "number" ? cur.pm10 : null,
      cpcb: null, main: null, approx: false
    };
    const conc = {};
    if (h && h.time) {
      const hr = (cur.time || "").slice(0, 13) + ":00";
      let idx = -1;
      for (let i = 0; i < h.time.length; i++) if (h.time[i] <= hr) idx = i;
      if (idx >= 0) {
        conc.pm25 = avgLast(h.pm2_5, idx, 24, 16);
        conc.pm10 = avgLast(h.pm10, idx, 24, 16);
        conc.no2 = avgLast(h.nitrogen_dioxide, idx, 24, 16);
        conc.so2 = avgLast(h.sulphur_dioxide, idx, 24, 16);
        conc.o3 = avgLast(h.ozone, idx, 8, 6);
        const co = avgLast(h.carbon_monoxide, idx, 8, 6);
        conc.co = co == null ? null : co / 1000;
      }
    }
    const have = Object.keys(conc).filter((k) => conc[k] != null);
    if (have.length >= 3 && (conc.pm25 != null || conc.pm10 != null)) {
      have.forEach((k) => {
        const si = subIndex(k, conc[k]);
        if (out.cpcb == null || si > out.cpcb) { out.cpcb = si; out.main = k; }
      });
    } else if (out.pm25 != null || out.pm10 != null) {
      out.approx = true;
      if (out.pm25 != null) { out.cpcb = subIndex("pm25", out.pm25); out.main = "pm25"; }
      if (out.pm10 != null) {
        const si = subIndex("pm10", out.pm10);
        if (out.cpcb == null || si > out.cpcb) { out.cpcb = si; out.main = "pm10"; }
      }
    }
    return out;
  }
  const cpcbCat = (v) => (v <= 50 ? "cpGood" : v <= 100 ? "cpSat" : v <= 200 ? "cpMod" : v <= 300 ? "cpPoor" : v <= 400 ? "cpVery" : "cpSevere");
  const AQI_COLORS = ["#2F9E63", "#9BC53D", "#E2B93B", "#F28C28", "#D64545", "#7A1F3D"];
  const AQI_WIDTHS = [10, 10, 20, 20, 20, 20];
  const uvCat = (v) => (v < 3 ? "uvLow" : v < 6 ? "uvMod" : v < 8 ? "uvHigh" : v < 11 ? "uvVery" : "uvExt");
  const compass = (d) => t("dirs." + (Math.round((((d % 360) + 360) % 360) / 45) % 8));

  function adviceFor(w, air) {
    const out = [];
    const feels = w.current.apparent_temperature;
    if (feels >= 41) out.push(["warn", "advHeat"]);
    else if (feels <= 8) out.push(["info", "advCold"]);
    if ((w.daily.precipitation_probability_max[0] ?? 0) >= 50) out.push(["info", "advRain"]);
    if (air && air.cpcb != null && air.cpcb > 200) out.push(["bad", "advSmog"]);
    if ((w.daily.uv_index_max[0] ?? 0) >= 8) out.push(["warn", "advUv"]);
    return out.slice(0, 3);
  }

  function sunArc(w) {
    const rise = minutes(w.daily.sunrise[0]), set = minutes(w.daily.sunset[0]), now = minutes(w.current.time);
    const f = (now - rise) / (set - rise);
    let dot = "";
    if (f >= 0 && f <= 1) {
      const th = Math.PI * (1 - f);
      dot = `<circle class="arc-dot" cx="${(40 + 30 * Math.cos(th)).toFixed(1)}" cy="${(40 - 30 * Math.sin(th)).toFixed(1)}" r="4.5"/>`;
    }
    return `<svg class="arc" viewBox="0 0 80 46" aria-hidden="true"><path class="arc-line" d="M10 40 A30 30 0 0 1 70 40"/><line class="arc-base" x1="4" y1="40" x2="76" y2="40"/>${dot}</svg>`;
  }

  /* ---------- alerts ---------- */
  /* Levels follow the IMD colour code: 1 yellow (be aware), 2 orange (be prepared), 3 red (take action).
     Rain steps are IMD's rainfall classes (heavy, very heavy, extremely heavy). The rest are plain thresholds. */
  const lvlHigh = (v, a, b, c) => (v >= c ? 3 : v >= b ? 2 : v >= a ? 1 : 0);
  const lvlLow = (v, a, b, c) => (v <= c ? 3 : v <= b ? 2 : v <= a ? 1 : 0);
  const TITLE_N = { heat: 3, cold: 3, rain: 3, storm: 2, wind: 3, fog: 3, uv: 2, air: 3 };

  function computeAlerts(w, air) {
    const d = w.daily, h = w.hourly, out = [];
    const days = Math.min(3, d.time.length);
    for (let i = 0; i < days; i++) {
      const date = d.time[i];
      const add = (type, level, vals) => { if (level > 0) out.push({ type, level, day: i, date, vals }); };

      const tmax = d.temperature_2m_max[i];
      const feel = d.apparent_temperature_max ? d.apparent_temperature_max[i] : tmax;
      let heat = lvlHigh(tmax, 40, 43, 46);
      if (heat === 0 && feel >= 44) heat = 1;
      add("heat", heat, { tmax, feel });

      const tmin = d.temperature_2m_min[i];
      add("cold", lvlLow(tmin, 6, 3, 0), { tmin });

      const mm = d.precipitation_sum[i] ?? 0;
      add("rain", lvlHigh(mm, 64.5, 115.6, 204.5), { mm });

      const code = d.weather_code[i];
      add("storm", code >= 96 ? 2 : code === 95 ? 1 : 0, { hail: code >= 96 });

      const gust = d.wind_gusts_10m_max ? d.wind_gusts_10m_max[i] ?? 0 : 0;
      add("wind", lvlHigh(gust, 50, 65, 90), { kmh: gust });

      let vis = Infinity;
      if (h.visibility) {
        for (let k = 0; k < h.time.length; k++) {
          if (h.time[k].startsWith(date) && h.visibility[k] != null) vis = Math.min(vis, h.visibility[k]);
        }
      }
      add("fog", Number.isFinite(vis) ? lvlLow(vis, 500, 200, 50) : 0, { m: vis });

      const uv = d.uv_index_max[i] ?? 0;
      add("uv", uv >= 11 ? 2 : uv >= 8 ? 1 : 0, { uv });
    }
    if (air && air.cpcb != null) {
      const level = lvlHigh(air.cpcb, 201, 301, 401);
      if (level > 0) out.push({ type: "air", level, day: 0, date: d.time[0], vals: { aqi: air.cpcb }, now: true });
    }
    return out.sort((x, y) => y.level - x.level || x.day - y.day);
  }

  const alertTitle = (a) => t("alTitle." + a.type + "." + (Math.min(a.level, TITLE_N[a.type]) - 1));
  function alertDetail(a) {
    const v = a.vals;

      case "cold": return t("alDetail.cold", { tmin: deg(v.tmin) });
      case "rain": return t("alDetail.rain", { mm: Math.round(v.mm) });
      case "storm": return t(v.hail ? "alDetail.stormHail" : "alDetail.storm");
      case "wind": return t("alDetail.wind", { kmh: Math.round(v.kmh) });
      case "fog": return t("alDetail.fog", { m: Math.round(v.m) });
      case "uv": return t("alDetail.uv", { uv: Math.round(v.uv) });
      case "air": return t("alDetail.air", { aqi: Math.round(v.aqi) });
      default: return "";
    }
  }

  const warnIcon = () =>
    `<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><path d="M8 1.2 15.2 14H0.8z" fill="currentColor"/><rect class="mark" x="7.2" y="5.6" width="1.6" height="4.6"/><circle class="mark" cx="8" cy="12" r="1"/></svg>`;
  const checkIcon = () =>
    `<svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="9" fill="var(--good)"/><path d="M5.8 10.4l2.8 2.8 5.6-5.8" fill="none" stroke="var(--surface)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  function weatherHtml() {

    const hero = `
