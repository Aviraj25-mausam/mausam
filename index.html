          ${speakOk ? `<button type="button" class="btn-ic" id="speak-btn" data-act="speak" aria-pressed="${state.speaking}">${ICON_SPEAK}<span>${esc(state.speaking ? t("speakStop") : t("speakBtn"))}</span></button>` : ""}
        </div>
        <svg class="sky" viewBox="0 0 800 120" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false">${skyInner(state.place, SKY_PAGE, !!(state.w && state.w.current && state.w.current.is_day === 0))}</svg>
      </section>`;

    const uv = d.uv_index_max[0] ?? 0;
    const rainMm = d.precipitation_sum[0] ?? 0;
    const rainProb = d.precipitation_probability_max[0] ?? 0;
    const stats = `
      <div class="stats">
        <div class="tile"><p class="tile-label">${esc(t("humidity"))}</p><p class="tile-value">${Math.round(c.relative_humidity_2m)}<small>%</small></p></div>
        <div class="tile"><p class="tile-label">${esc(t("wind"))}</p><p class="tile-value">${Math.round(c.wind_speed_10m)}<small>${esc(t("kmh"))}</small></p><p class="tile-sub">${esc(compass(c.wind_direction_10m))}</p></div>
        <div class="tile"><p class="tile-label">${esc(t("uv"))}</p><p class="tile-value">${Math.round(uv)}</p><p class="tile-sub">${esc(t(uvCat(uv)))}</p></div>
        <div class="tile"><p class="tile-label">${esc(t("rainToday"))}</p><p class="tile-value">${rainMm.toFixed(1)}<small>mm</small></p><p class="tile-sub">${Math.round(rainProb)}% ${esc(t("chance"))}</p></div>
        <div class="tile"><p class="tile-label">${esc(t("pressure"))}</p><p class="tile-value">${Math.round(c.pressure_msl)}<small>hPa</small></p></div>
        <div class="tile"><p class="tile-label">${esc(t("cloud"))}</p><p class="tile-value">${Math.round(c.cloud_cover ?? 0)}<small>%</small></p></div>
        <div class="tile wide"><div class="sun-times"><div><p class="tile-label">${esc(t("rise"))}</p><p class="tile-value">${esc(clock(d.sunrise[0]))}</p></div><div><p class="tile-label">${esc(t("set"))}</p><p class="tile-value">${esc(clock(d.sunset[0]))}</p></div></div>${sunArc(w)}</div>
      </div>`;

    const cur = c.time.slice(0, 13) + ":00";
    let i0 = h.time.findIndex((x) => x >= cur);
    if (i0 < 0) i0 = 0;
    let hours = "";
    for (let i = i0; i < Math.min(i0 + 24, h.time.length); i++) {
      const rp = h.precipitation_probability[i];
      hours += `<div class="hour${i === i0 ? " now" : ""}">
        <span class="h-time">${i === i0 ? esc(t("now")) : hour12(+h.time[i].slice(11, 13))}</span>
        ${icon(kindOf(h.weather_code[i]), h.is_day[i] === 0)}
        <span class="h-temp">${deg(h.temperature_2m[i])}</span>
        <span class="h-rain">${rp >= 20 ? Math.round(rp) + "%" : ""}</span>
      </div>`;
    }
    const hourly = `<section class="card hourly"><h2>${esc(t("hourly"))}</h2><div class="hours">${hours}</div></section>`;

    const mins = d.temperature_2m_min, maxs = d.temperature_2m_max;
    const gmin = Math.min(...mins), gmax = Math.max(...maxs), span = Math.max(gmax - gmin, 1);
    let days = "";
    for (let i = 0; i < d.time.length; i++) {
      const left = ((mins[i] - gmin) / span) * 100;
      const width = Math.max(((maxs[i] - mins[i]) / span) * 100, 6);
      const rp = d.precipitation_probability_max[i] ?? 0;
      days += `<li class="day">
        <span class="d-name">${esc(dayName(i, d.time[i]))}</span>
        ${icon(kindOf(d.weather_code[i]), false)}
        <span class="d-rain">${rp >= 20 ? Math.round(rp) + "%" : ""}</span>
        <span class="d-lo">${deg(mins[i])}</span>
        <span class="track"><span class="fill" style="left:${left.toFixed(1)}%;width:${Math.min(width, 100 - left).toFixed(1)}%"></span></span>
        <span class="d-hi">${deg(maxs[i])}</span>
      </li>`;
    }
    const daily = `<section class="card daily"><h2>${esc(t("daily"))}</h2><ul class="days">${days}</ul></section>`;

    return `${staleBanner()}<div class="grid">${alertsCard()}${hero}${stats}${aqiCardHtml(air, state.place)}${hourly}${daily}</div>`;
  }

  /* ---------- farmer view ---------- */
  const SPRAY = { wind: 15, rain: 0.1, prob: 30, tmin: 8, tmax: 35, from: 6, to: 18 };

  function sprayWindows(a, nowStr) {
    const h = a.hourly, out = [];
    let i0 = h.time.findIndex((x) => x >= nowStr.slice(0, 13) + ":00");
    if (i0 < 0) i0 = 0;
    const end = Math.min(h.time.length, i0 + 48);
    const ok = (i) => {
      const hr = +h.time[i].slice(11, 13);
      const wind = h.wind_speed_10m[i], rain = h.precipitation[i], p = h.precipitation_probability[i], tmp = h.temperature_2m[i];
      if (wind == null || rain == null || tmp == null) return false;
      return hr >= SPRAY.from && hr <= SPRAY.to && wind <= SPRAY.wind && rain < SPRAY.rain && (p == null || p <= SPRAY.prob) && tmp >= SPRAY.tmin && tmp <= SPRAY.tmax;
    };
    let start = -1;
    for (let i = i0; i <= end; i++) {
      const good = i < end && ok(i);
      if (good && start < 0) start = i;
      if (!good && start >= 0) {
        if (i - start >= 2) out.push({ date: h.time[start].slice(0, 10), from: +h.time[start].slice(11, 13), to: +h.time[i - 1].slice(11, 13) + 1, len: i - start });
        start = -1;
      }
    }
    return out;
  }

  function irrigation(b, w) {
    if (!b || !b.daily || !b.daily.et0_fao_evapotranspiration) return null;
    const et = b.daily.et0_fao_evapotranspiration.slice(0, 3).reduce((s, v) => s + (v || 0), 0);
    const rain = w.daily.precipitation_sum.slice(0, 3).reduce((s, v) => s + (v || 0), 0);
    let soil = null;
    if (b.hourly && b.hourly.soil_moisture_3_to_9cm) {
      const hr = w.current.time.slice(0, 13) + ":00";
      let idx = -1;
      for (let i = 0; i < b.hourly.time.length; i++) if (b.hourly.time[i] <= hr) idx = i;
      if (idx >= 0 && typeof b.hourly.soil_moisture_3_to_9cm[idx] === "number") soil = b.hourly.soil_moisture_3_to_9cm[idx];
    }
    const bal = et - rain;
    const dry = soil != null && soil < 0.15;
    let level = "farmIrrNone", tone = "ok";
    if (rain >= 20) { level = "farmIrrNone"; }
    else if (bal > 15 || (bal > 8 && dry)) { level = "farmIrrNeed"; tone = "warn"; }
    else if (bal > 6 || dry) { level = "farmIrrWatch"; }
    return { et, rain, soil, level, tone };
  }

  function farmHtml() {
    const f = state.farm, w = state.w;
    if (f.status === "loading" || f.status === "idle") return `${staleBanner()}${stateCard(t("farmLoading"))}`;
    if (f.status === "error") return stateCard(t("farmFail"), "retry-farm");
    const a = f.data.a, b = f.data.b;
    const d = w.daily;

    /* spray window */
    const wins = sprayWindows(a, w.current.time);
    const best = wins.length ? wins.reduce((m, x) => (x.len > m.len ? x : m), wins[0]) : null;
    const shown = wins.slice().sort((x, y) => y.len - x.len).slice(0, 3).sort((x, y) => (x.date + String(x.from).padStart(2, "0")).localeCompare(y.date + String(y.from).padStart(2, "0")));
    const spray = `<section class="card"><h2>${esc(t("farmSprayTitle"))}</h2><p class="lead">${esc(t("farmSprayNote"))}</p>` +
      (shown.length
        ? `<ul class="win-list">${shown.map((x) =>
            `<li class="win${x === best ? " best" : ""}"><span>${esc(t("farmWindow", { day: dayLabelFor(x.date), from: hour12(x.from), to: hour12(x.to) }))}${x === best ? `<span class="pill">${esc(t("farmBest"))}</span>` : ""}</span><span class="w-len">${esc(t("farmHours", { n: x.len }))}</span></li>`).join("")}</ul>`
        : `<p class="chip-s warn">${esc(t("farmNoSpray"))}</p>`) +
      `</section>`;

    /* irrigation and soil */
    const irr = irrigation(b, w);
    let irrCard;
    if (!irr) {
      irrCard = `<section class="card"><h2>${esc(t("farmIrrTitle"))}</h2><p class="lead">${esc(t("farmNoIrr"))}</p></section>`;
    } else {
      let soilHtml = "";
      if (irr.soil != null) {
        const cat = irr.soil < 0.15 ? "farmSoilDry" : irr.soil < 0.3 ? "farmSoilOk" : "farmSoilWet";
        const pos = Math.min(irr.soil / 0.5, 1) * 100;
        soilHtml = `<div class="soil"><div class="soil-head"><span>${esc(t("farmSoilTitle"))}</span><span>${Math.round(irr.soil * 100)}% · ${esc(t(cat))}</span></div>
          <div class="scale-wrap"><div class="scale"><span style="width:30%;background:#E2B93B"></span><span style="width:30%;background:#2F9E63"></span><span style="width:40%;background:#2E86A8"></span></div><div class="marker" style="left:${pos.toFixed(1)}%"></div></div>
          <p class="note">${esc(t("farmSoilNote"))}</p></div>`;
      }
      irrCard = `<section class="card"><h2>${esc(t("farmIrrTitle"))}</h2>
        <div class="status-row"><span class="chip-s ${irr.tone}">${esc(t(irr.level))}</span></div>
        <p class="lead">${esc(t("farmIrrDetail", { et: Math.round(irr.et), rain: Math.round(irr.rain) }))}</p>${soilHtml}</section>`;
    }

    /* frost and heat */
    const items = [];
    for (let i = 0; i < d.time.length && items.length < 4; i++) {
      const lo = d.temperature_2m_min[i], hi = d.temperature_2m_max[i], day = dayLabelFor(d.time[i]);
      if (lo <= 4) items.push([lo <= 2 ? "bad" : "warn", t(lo <= 2 ? "farmFrostLikely" : "farmFrostPossible", { day, t: deg(lo) })]);
      if (items.length < 4 && hi >= 40) items.push(["warn", t("farmHeat", { day, t: deg(hi) })]);
    }
    const crop = `<section class="card"><h2>${esc(t("farmCropTitle"))}</h2>` +
      (items.length ? `<ul class="crop-list">${items.map(([tone, msg]) => `<li class="${tone}">${esc(msg)}</li>`).join("")}</ul>` : `<p class="lead">${esc(t("farmCropOk"))}</p>`) + `</section>`;

    /* rain this week */
    const rain = d.precipitation_sum.map((v) => v || 0);
    const total = rain.reduce((s, v) => s + v, 0);
    const mx = Math.max(10, ...rain);
    const rainCard = `<section class="card"><h2>${esc(t("farmRainTitle"))}</h2><p class="big-num">${esc(t("farmRainTotal", { mm: Math.round(total) }))}</p>
      <div class="bars">${rain.map((v) => `<div class="bar-col"><span>${v >= 0.5 ? Math.round(v) : ""}</span><div class="bar" style="height:${Math.max(2, (v / mx) * 100).toFixed(1)}%"></div></div>`).join("")}</div>
      <div class="bar-labels">${d.time.map((x, i) => `<span>${esc(shortDay(i, x))}</span>`).join("")}</div></section>`;

    return `${staleBanner()}<div class="stack two">${spray}${irrCard}${crop}${rainCard}</div><p class="note">${esc(t("farmNote"))}</p>`;
  }

  async function loadFarm() {
    const place = state.place, k = key(place), f = state.farm;
    f.key = k; f.status = "loading"; f.data = null;
    render();
    const base = "https://api.open-meteo.com/v1/forecast?latitude=" + place.lat + "&longitude=" + place.lon + "&timezone=Asia%2FKolkata&forecast_days=7";
    try {
      const a = fetch(base + "&hourly=temperature_2m,precipitation_probability,precipitation,wind_speed_10m").then((r) => { if (!r.ok) throw new Error("farm " + r.status); return r.json(); });
      const b = fetch(base + "&hourly=soil_moisture_3_to_9cm&daily=et0_fao_evapotranspiration").then((r) => (r.ok ? r.json() : null)).catch(() => null);
      const [fa, fb] = await Promise.all([a, b]);
      if (state.farm.key !== k) return;
      f.data = { a: fa, b: fb };
      f.status = "ready";
      cache.set("farm", k, f.data);
    } catch (e) {
      if (state.farm.key !== k) return;
      const hit = cache.get("farm", k);
      if (hit) { f.data = hit.data; f.status = "ready"; } else { f.status = "error"; }
    }
    render();
  }

  /* ---------- travel view ---------- */
  function travelDays(w) {
    const d = w.daily, h = w.hourly, out = [];
    for (let i = 0; i < d.time.length; i++) {
      const date = d.time[i], items = [];
      if (h.visibility) {
        let from = -1, to = -1, minV = Infinity;
        for (let k = 0; k < h.time.length; k++) {
          if (!h.time[k].startsWith(date)) continue;
          const v = h.visibility[k];
          if (v != null && v < 500) {
            const hr = +h.time[k].slice(11, 13);
            if (from < 0) from = hr;
            to = hr + 1;
            minV = Math.min(minV, v);
          }
        }
        if (from >= 0) items.push({ type: "Fog", level: Math.max(1, lvlLow(minV, 500, 200, 50)), vars: { from: hour12(from), to: hour12(to), m: Math.round(minV) } });
      }
      const mm = d.precipitation_sum[i] ?? 0;
      if (mm >= 30) items.push({ type: "Rain", level: mm >= 64.5 ? 2 : 1, vars: { mm: Math.round(mm) } });
      const code = d.weather_code[i];
      if (code >= 95) items.push({ type: "Storm", level: code >= 96 ? 2 : 1, vars: {} });
      const gust = d.wind_gusts_10m_max ? d.wind_gusts_10m_max[i] ?? 0 : 0;
      if (gust >= 50) items.push({ type: "Wind", level: gust >= 65 ? 2 : 1, vars: { kmh: Math.round(gust) } });
      const tmax = d.temperature_2m_max[i];
      if (tmax >= 43) items.push({ type: "Heat", level: tmax >= 46 ? 2 : 1, vars: { t: deg(tmax) } });
      items.sort((x, y) => y.level - x.level);
      out.push({ date, level: items.reduce((m, x) => Math.max(m, x.level), 0), items });
    }
    return out;
  }

  function travelHtml() {
    const w = state.w, days = travelDays(w);
    const sel = Math.min(state.travelDay, days.length - 1);
    const day = days[sel];
    const strip = days.map((x, i) =>
      `<button type="button" class="tday" data-act="tday" data-i="${i}" aria-pressed="${i === sel}"><span>${esc(shortDay(i, x.date))}</span><span class="dot l${x.level}"></span></button>`).join("");
    const head = `<div class="t-head"><span class="dot l${day.level}"></span><span>${esc(dayName(sel, day.date))} · ${esc(t("travelLevel." + day.level))}</span></div>`;
    const items = day.items.length
      ? `<ul class="t-items">${day.items.map((x) => `<li class="t-item l${x.level}">${esc(t("travel" + x.type, x.vars))}</li>`).join("")}</ul>`
      : `<ul class="t-items"><li class="t-item ok">${checkIcon()}<span>${esc(t("travelOk"))}</span></li></ul>`;
    return `${staleBanner()}<section class="card" style="margin-top:10px"><h2>${esc(t("travelTitle"))}</h2><p class="lead">${esc(t("travelPick"))}</p><div class="tdays">${strip}</div>${head}${items}<p class="note">${esc(t("travelNote"))}</p></section>`;
  }

  /* ---------- monsoon view ---------- */
  const SEASON_DAYS = 122;
  const MON_START = { 6: 0, 7: 30, 8: 61, 9: 92 };
  const seasonIdx = (date) => MON_START[+date.slice(5, 7)] + (+date.slice(8, 10) - 1);

  function monsoonStats(daily, Y, endCap) {
    const per = {};
    daily.time.forEach((date, i) => {
      const mo = +date.slice(5, 7);
      if (mo < 6 || mo > 9) return;
      const y = +date.slice(0, 4);
      if (!per[y]) per[y] = new Array(SEASON_DAYS).fill(null);
      const v = daily.precipitation_sum[i];
      per[y][seasonIdx(date)] = typeof v === "number" ? v : null;
    });
    const endIdx = seasonIdx(endCap);
    const cum = (arr, upto) => { const o = []; let s = 0; for (let i = 0; i <= upto; i++) { s += arr[i] || 0; o.push(s); } return o; };
    const now = per[Y] ? cum(per[Y], endIdx) : [];
    const norm = new Array(SEASON_DAYS).fill(0);
    let n = 0;
    for (let y = Y - 10; y < Y; y++) {
      if (!per[y]) continue;
      const c = cum(per[y], SEASON_DAYS - 1);
      for (let i = 0; i < SEASON_DAYS; i++) norm[i] += c[i];
      n++;
    }
    if (n) for (let i = 0; i < SEASON_DAYS; i++) norm[i] /= n;
    const totalNow = now.length ? now[now.length - 1] : 0;
    const normToDate = norm[endIdx];
    const pct = normToDate >= 1 ? ((totalNow - normToDate) / normToDate) * 100 : 0;
    const cat = pct >= 60 ? 4 : pct >= 20 ? 3 : pct > -20 ? 2 : pct > -60 ? 1 : 0;
    return { Y, endCap, endIdx, now, norm, totalNow, normToDate, pct, cat, years: n, complete: endIdx === SEASON_DAYS - 1 };
  }

  async function loadMon() {
    const place = state.place, k = key(place), m = state.mon;
    m.key = k; m.status = "loading"; m.data = null;
    render();
    const today = istDate(), ty = +today.slice(0, 4);
    const Y = today >= `${ty}-06-01` ? ty : ty - 1;
    const seasonEnd = `${Y}-09-30`, lag = addDays(today, -6);
    const endCap = lag < seasonEnd ? lag : seasonEnd;
    if (endCap < `${Y}-06-04`) { m.status = "early"; render(); return; }
    const ck = k + "|" + Y + "|" + endCap;
    const hit = cache.get("mon", ck);
    if (hit) { m.data = hit.data; m.status = "ready"; render(); return; }
    const url = "https://archive-api.open-meteo.com/v1/archive?latitude=" + place.lat + "&longitude=" + place.lon +
      "&start_date=" + (Y - 10) + "-06-01&end_date=" + endCap + "&daily=precipitation_sum&timezone=Asia%2FKolkata";
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error("archive " + r.status);
      const j = await r.json();
      if (state.mon.key !== k) return;
      m.data = monsoonStats(j.daily, Y, endCap);
      m.status = "ready";
      cache.set("mon", ck, m.data);
    } catch (e) {
      if (state.mon.key !== k) return;
      m.status = "error";
    }
    render();
  }

  function monthName(m0) { return new Intl.DateTimeFormat(locTag(), { month: "short" }).format(new Date(2026, m0, 1)); }

  function monsoonChart(s) {
    const X0 = 34, X1 = 312, Y0 = 140, Y1 = 12;
    const top = Math.max(s.norm[SEASON_DAYS - 1], s.totalNow, 50);
    const step = top > 1500 ? 500 : top > 600 ? 200 : top > 300 ? 100 : 50;
    const ymax = Math.ceil(top / step) * step;
    const x = (i) => X0 + (i / (SEASON_DAYS - 1)) * (X1 - X0);
    const y = (v) => Y0 - (v / ymax) * (Y0 - Y1);
    const line = (arr) => arr.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join("");
    const area = `${line(s.now)}L${x(s.endIdx).toFixed(1)} ${Y0}L${X0} ${Y0}z`;
    const ticks = [0, 30, 61, 92].map((i, k) => `<text x="${x(i).toFixed(1)}" y="${Y0 + 14}" text-anchor="${k === 0 ? "start" : "middle"}">${esc(monthName(5 + k))}</text>`).join("");
    const grid = [0, 0.5, 1].map((f) => `<line class="${f ? "gl" : "axis"}" x1="${X0}" x2="${X1}" y1="${y(ymax * f).toFixed(1)}" y2="${y(ymax * f).toFixed(1)}"/><text x="${X0 - 4}" y="${(y(ymax * f) + 3).toFixed(1)}" text-anchor="end">${Math.round(ymax * f)}</text>`).join("");
    const label = `${t("monThis")}: ${Math.round(s.totalNow)} mm. ${t("monAvg")}: ${Math.round(s.normToDate)} mm.`;
    return `<svg class="chart" viewBox="0 0 320 160" role="img" aria-label="${esc(label)}">${grid}${ticks}
      <path class="area-now" d="${area}"/><path class="ln-norm" d="${line(s.norm)}"/><path class="ln-now" d="${line(s.now)}"/>
      <circle cx="${x(s.endIdx).toFixed(1)}" cy="${y(s.totalNow).toFixed(1)}" r="4" fill="var(--cool)"/></svg>`;
  }

  function monsoonHtml() {
    const m = state.mon;
    if (m.status === "idle" || m.status === "loading") return stateCard(t("monLoading"));
    if (m.status === "early") return stateCard(t("monTooEarly"));
    if (m.status === "error") return stateCard(t("monFail"), "retry-mon");
    const s = m.data;
    const absPct = Math.round(Math.abs(s.pct));
    const phrase = absPct < 5 ? t("monNear") : t(s.pct > 0 ? "monAbove" : "monBelow", { pct: absPct });
    const tone = s.cat === 2 ? "ok" : s.cat >= 3 ? "ok" : "warn";
    const title = s.complete ? t("monPast", { year: s.Y }) : t("monNow", { year: s.Y });
    return `<section class="card" style="margin-top:10px"><h2>${esc(t("monTitle"))}</h2>
      <p class="lead">${esc(title)}. ${esc(t("monUpTo", { date: new Intl.DateTimeFormat(locTag(), { day: "numeric", month: "short" }).format(new Date(s.endCap + "T00:00:00")) }))}</p>
      <div class="mon-tiles">
        <div class="tile"><p class="tile-label">${esc(t("monRain"))}</p><p class="tile-value">${Math.round(s.totalNow)}<small>mm</small></p></div>
        <div class="tile"><p class="tile-label">${esc(t("monNormal"))}</p><p class="tile-value">${Math.round(s.normToDate)}<small>mm</small></p></div>
        <div class="tile"><p class="tile-label">${esc(t("monDeparture"))}</p><p class="tile-sub" style="margin:0">${esc(phrase)}</p><p style="margin:6px 0 0"><span class="chip-s ${tone}">${esc(t("monCat." + s.cat))}</span></p></div>
      </div>
      ${monsoonChart(s)}
      <div class="legend"><span><span class="sw"></span>${esc(t("monThis"))}</span><span><span class="sw dash"></span>${esc(t("monAvg"))}</span></div>
      <p class="note">${esc(t("monNote"))}</p></section>`;
  }

  /* ---------- data ---------- */
  async function fetchWeather(place) {
    const q = `latitude=${place.lat}&longitude=${place.lon}&timezone=Asia%2FKolkata`;
    const forecast =
      "https://api.open-meteo.com/v1/forecast?" + q +
      "&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m" +
      "&hourly=temperature_2m,precipitation_probability,weather_code,is_day,visibility" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,sunrise,sunset,uv_index_max,precipitation_sum,precipitation_probability_max,wind_gusts_10m_max" +
      "&forecast_days=7";
    const air = "https://air-quality-api.open-meteo.com/v1/air-quality?" + q +
      "&current=us_aqi,pm2_5,pm10&hourly=pm2_5,pm10,nitrogen_dioxide,sulphur_dioxide,ozone,carbon_monoxide&past_days=1&forecast_days=1";
    const [wr, ar] = await Promise.all([fetch(forecast), fetch(air).catch(() => null)]);
    if (!wr.ok) throw new Error("forecast " + wr.status);
    const w = await wr.json();
    let airRaw = null;
    try { airRaw = ar && ar.ok ? await ar.json() : null; } catch (e) { airRaw = null; }
    return { w, airRaw, air: analyzeAir(airRaw) };
  }

  function finishLoad(place) {
    state.alerts = computeAlerts(state.w, state.air);
    state.status = "ready";
    if (isWatched(place)) watch.status[key(place)] = { alerts: state.alerts, at: Date.now() };
  }

  async function load(place) {
    place = norm(place);
    const token = ++state.token;
    state.place = place;
    state.status = "loading";
    state.stale = 0;
    state.travelDay = 0;
    stopSpeak();
    render();
    try {
      const { w, air, airRaw } = await fetchWeather(place);
      if (token !== state.token) return;
      state.w = w; state.air = air; state.stale = 0;
      cache.set("wx", key(place), { w, airRaw });
      finishLoad(place);
    } catch (e) {
      if (token !== state.token) return;
      const hit = cache.get("wx", key(place));
      if (hit) {
        state.w = hit.data.w; state.air = analyzeAir(hit.data.airRaw); state.stale = hit.at;
        finishLoad(place);
      } else {
        state.status = "error";
      }
    }
    render();
    renderNotify();
    ensureData();
  }

  function ensureData() {
    if (!state.place) return;
    const k = key(state.place);
    if (state.view === "farm" && state.status === "ready" && state.farm.key !== k) loadFarm();
    if (state.view === "monsoon" && state.mon.key !== k) loadMon();
  }

  function pick(place) {
    hideResults();
    $("q").value = "";
    place = norm(place);
    if (!place.here) {
      const s = slim(place);
      const recent = store.get("recent", []).map(norm).filter((p) => !samePlace(p, place));
      recent.unshift(s);
      store.set("recent", recent.slice(0, 5));
      store.set("last", s);
    }
    load(place);
  }

  /* ---------- search ---------- */
  let timer = 0, searchSeq = 0, found = [];
  const resultsEl = $("results");

  function hideResults() { resultsEl.hidden = true; resultsEl.innerHTML = ""; found = []; }

  function notify(msg) {
    const n = $("notice");
    n.textContent = msg;
    n.hidden = false;
    clearTimeout(notify.t);
    notify.t = setTimeout(() => { n.hidden = true; }, 7000);
  }

  async function search(q) {
    const seq = ++searchSeq;
    try {
      const url = "https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(q) +
        "&count=6&format=json&countryCode=IN&language=" + state.lang;
      const r = await fetch(url);
      if (!r.ok) throw new Error("geocoding " + r.status);
      const j = await r.json();
      if (seq !== searchSeq) return;
      found = (j.results || []).map((x) => ({ name: x.name, sub: x.admin1 || "", lat: x.latitude, lon: x.longitude }));
      resultsEl.hidden = false;
      resultsEl.innerHTML = found.length
        ? found.map((p, i) => `<li><button type="button" data-i="${i}"><span>${esc(p.name)}</span><span class="r-sub">${esc(p.sub)}</span></button></li>`).join("")
        : `<li class="r-empty">${esc(t("noResults"))} “${esc(q)}”</li>`;
    } catch (e) {
      if (seq !== searchSeq) return;
      hideResults();
      notify(t("errNet"));
    }
  }

  $("q").addEventListener("input", (e) => {
    clearTimeout(timer);
    const q = e.target.value.trim();
    if (q.length < 2) { searchSeq++; hideResults(); return; }
    timer = setTimeout(() => search(q), 300);
  });
  $("search-form").addEventListener("submit", (e) => {
    e.preventDefault();
    if (found.length) { pick(found[0]); return; }
    const q = $("q").value.trim();
    if (q.length >= 2) search(q);
  });
  resultsEl.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-i]");
    if (b) pick(found[+b.dataset.i]);
  });
  document.addEventListener("click", (e) => { if (!e.target.closest(".search-wrap")) hideResults(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideResults(); });

  /* ---------- location ---------- */
  $("locate").addEventListener("click", () => {
    if (!navigator.geolocation) { notify(t("geoUnsupported")); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const lat = pos.coords.latitude, lon = pos.coords.longitude;
        load({ here: true, name: "", sub: lat.toFixed(2) + "°N, " + lon.toFixed(2) + "°E", lat, lon });
      },
      () => notify(t("geoDenied")),
      { timeout: 10000, maximumAge: 300000 }
    );
  });

  /* ---------- share picture ---------- */
  const FONT_STACK = "'Bricolage Grotesque','Hanken Grotesk','Noto Sans Devanagari','Noto Sans Tamil','Noto Sans Telugu','Noto Sans Bengali','Noto Sans Gujarati','Noto Sans Kannada','Noto Sans Malayalam','Noto Sans Gurmukhi',system-ui,sans-serif";

  function loadSvgImage(svg) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    });
  }

  function wrapLines(ctx, text, maxW) {
    const words = text.split(/\s+/), lines = [];
    let line = "";
    for (const wd of words) {
      const test = line ? line + " " + wd : wd;
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = wd; } else { line = test; }
    }
    if (line) lines.push(line);
    return lines;
  }

  function summaryText() {
    const c = state.w.current, d = state.w.daily;
    return t("shareText", { place: placeName(state.place), temp: deg(c.temperature_2m), cond: t(condKey(c.weather_code)), hi: deg(d.temperature_2m_max[0]), lo: deg(d.temperature_2m_min[0]) });
  }

  async function makeShareImage() {
    const w = state.w, c = w.current, d = w.daily, air = state.air, W = 1080, H = 1350;
    const kind = kindOf(c.weather_code), night = c.is_day === 0;
    const cond = t(condKey(c.weather_code));
    const place = placeName(state.place), sub = placeSub(state.place);
    const top = state.alerts[0];

    if (document.fonts && document.fonts.load) {
      const sample = place + sub + cond + t("shareFooter") + (top ? alertTitle(top) + alertDetail(top) : "") + "0123456789";
      try { await Promise.all([document.fonts.load("700 80px " + FONT_STACK, sample), document.fonts.load("500 40px " + FONT_STACK, sample)]); } catch (e) { /* use fallback fonts */ }
    }

    const cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    const x = cv.getContext("2d");
    const pal = night ? ["#0E1A3D", "#2B4A8C"]
      : kind === "rain" || kind === "storm" || kind === "drizzle" ? ["#2A4358", "#5E87A3"]
      : kind === "cloud" || kind === "fog" ? ["#506A7B", "#9AB0BD"] : ["#2877B5", "#86CDEB"];
    const g = x.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, pal[0]); g.addColorStop(1, pal[1]);
    x.fillStyle = g; x.fillRect(0, 0, W, H);

    x.textBaseline = "alphabetic";
    const fit = (text, weight, size, maxW) => {
      let s = size;
      x.font = `${weight} ${s}px ${FONT_STACK}`;
      while (x.measureText(text).width > maxW && s > size * 0.55) { s -= 2; x.font = `${weight} ${s}px ${FONT_STACK}`; }
    };
    x.fillStyle = "#fff";
    fit(place, 700, 88, W - 140); x.fillText(place, 70, 170);
    if (sub) { x.fillStyle = "rgba(255,255,255,.8)"; fit(sub, 500, 38, W - 140); x.fillText(sub, 70, 222); }
    x.fillStyle = "rgba(255,255,255,.8)";
    const stamp = new Intl.DateTimeFormat(locTag(), { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit", timeZone: "Asia/Kolkata" }).format(new Date());
    fit(stamp, 500, 34, W - 140); x.fillText(stamp, 70, 272);

    const ic = await loadSvgImage(iconFlat(kind, night));
    x.drawImage(ic, 640, 250, 380, 380);

    x.fillStyle = "#fff";
    const tempStr = String(degN(c.temperature_2m));
    x.font = `700 300px ${FONT_STACK}`;
    x.fillText(tempStr, 60, 590);
    const tw = x.measureText(tempStr).width;
    x.font = `500 96px ${FONT_STACK}`;
    x.fillText("°" + state.unit, 70 + tw, 470);

    fit(cond, 700, 64, W - 140); x.fillText(cond, 70, 690);
    x.fillStyle = "rgba(255,255,255,.88)";
    const line = `${t("feels")} ${deg(c.apparent_temperature)} · ${t("high")} ${deg(d.temperature_2m_max[0])} · ${t("low")} ${deg(d.temperature_2m_min[0])}`;
    fit(line, 500, 40, W - 140); x.fillText(line, 70, 752);

    if (air && air.cpcb != null) {
      const col = AQI_COLORS[air.cpcb <= 50 ? 0 : air.cpcb <= 100 ? 1 : air.cpcb <= 200 ? 2 : air.cpcb <= 300 ? 3 : air.cpcb <= 400 ? 4 : 5];
      x.fillStyle = "rgba(0,0,0,.28)";
      x.beginPath(); x.roundRect(70, 790, 560, 84, 42); x.fill();
      x.fillStyle = col; x.beginPath(); x.arc(112, 832, 16, 0, Math.PI * 2); x.fill();
      x.fillStyle = "#fff";
      const aq = `AQI ${air.cpcb} · ${t(cpcbCat(air.cpcb))}`;
      fit(aq, 600, 38, 460); x.fillText(aq, 146, 846);
    }

    if (top) {
      const bg = top.level === 3 ? "#C93636" : top.level === 2 ? "#F28C28" : "#E2B93B";
      const fg = top.level === 3 ? "#fff" : "#1d1500";
      const head = `${lvlName(top.level)} · ${alertTitle(top)} · ${whenLabel(top)}`;
      x.font = `700 40px ${FONT_STACK}`;
      const hl = wrapLines(x, head, W - 200).slice(0, 2);
      x.font = `500 34px ${FONT_STACK}`;
      const dl = wrapLines(x, alertDetail(top), W - 200).slice(0, 2);
      const bh = 50 + hl.length * 50 + dl.length * 44;
      x.fillStyle = bg; x.beginPath(); x.roundRect(70, 900, W - 140, bh, 28); x.fill();
      x.fillStyle = fg;
      let yy = 960;
      x.font = `700 40px ${FONT_STACK}`; hl.forEach((l) => { x.fillText(l, 106, yy); yy += 50; });
      x.font = `500 34px ${FONT_STACK}`; dl.forEach((l) => { x.fillText(l, 106, yy); yy += 44; });
    }

    const sky = await loadSvgImage(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="1600" height="240">${skyInner(state.place, SKY_CARD, !!(state.w && state.w.current && state.w.current.is_day === 0))}</svg>`);
    x.drawImage(sky, 0, H - 270, W, 162);
    x.fillStyle = "rgba(255,255,255,.14)"; x.fillRect(0, H - 108, W, 108);
    x.fillStyle = "#fff";
    const foot = t("shareFooter");
    fit(foot, 700, 40, W - 140); x.fillText(foot, 70, H - 52);
    x.fillStyle = "rgba(255,255,255,.7)"; x.font = `500 26px ${FONT_STACK}`;
    x.fillText("Open-Meteo.com", 70, H - 18);

    return new Promise((resolve, reject) => cv.toBlob((b) => (b ? resolve(b) : reject(new Error("no blob"))), "image/png"));
  }

  async function shareCard() {
    if (state.status !== "ready") return;
    try {
      const blob = await makeShareImage();
      const file = new File([blob], "mausam-weather.png", { type: "image/png" });
      const data = { files: [file], title: t("shareTitle"), text: summaryText() };
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share(data);
        return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "mausam-weather.png";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 8000);
      notify(t("shareSaved"));
    } catch (e) {
      if (e && e.name === "AbortError") return;
      notify(t("shareFail"));
    }
  }

  /* ---------- speak the weather ---------- */
  const speechOk = () => "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";

  function spokenText() {
    const w = state.w, c = w.current, d = w.daily;
    const parts = [t("spkMain", {
      place: placeName(state.place), temp: degN(c.temperature_2m), unit: t(state.unit === "C" ? "unitC" : "unitF"),
      cond: t(condKey(c.weather_code)), feel: degN(c.apparent_temperature), hi: degN(d.temperature_2m_max[0]),
      lo: degN(d.temperature_2m_min[0]), rain: Math.round(d.precipitation_probability_max[0] ?? 0)
    })];
    if (state.air && state.air.cpcb != null) parts.push(t("spkAir", { cat: t(cpcbCat(state.air.cpcb)) }));
    const top = state.alerts[0];
    if (top) parts.push(t("spkAlert", { title: alertTitle(top), detail: alertDetail(top).replace(/°/g, "") }));
    return parts.join(" ");
  }

  function updateSpeakBtn() {
    const b = $("speak-btn");
    if (!b) return;
    b.setAttribute("aria-pressed", String(state.speaking));
    const s = b.querySelector("span");
    if (s) s.textContent = state.speaking ? t("speakStop") : t("speakBtn");
  }
  function stopSpeak() {
    if (speechOk() && (state.speaking || window.speechSynthesis.speaking)) { try { window.speechSynthesis.cancel(); } catch (e) { /* ignore */ } }
    state.speaking = false;
    updateSpeakBtn();
  }
  function toggleSpeak() {
    if (!speechOk() || state.status !== "ready") return;
    if (state.speaking) { stopSpeak(); return; }
    const ss = window.speechSynthesis;
    ss.cancel();
    const u = new SpeechSynthesisUtterance(spokenText());
    u.lang = locTag();
    u.rate = 0.95;
    const want = u.lang.toLowerCase();
    const voices = ss.getVoices() || [];
    const v = voices.find((x) => x.lang && x.lang.replace("_", "-").toLowerCase() === want) ||
      voices.find((x) => x.lang && x.lang.toLowerCase().startsWith(want.slice(0, 2)));
    if (v) u.voice = v;
    u.onend = () => { state.speaking = false; updateSpeakBtn(); };
    u.onerror = (e) => {
      state.speaking = false; updateSpeakBtn();
      if (!e || (e.error !== "canceled" && e.error !== "interrupted")) notify(t("speakFail"));
    };
    state.speaking = true;
    updateSpeakBtn();
    ss.speak(u);
  }

  /* ---------- clicks inside the main view ---------- */
  $("view").addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]");
    if (!b) return;
    const act = b.dataset.act;
    if (act === "share") shareCard();
    else if (act === "speak") toggleSpeak();
    else if (act === "retry") load(state.place);
    else if (act === "retry-farm") loadFarm();
    else if (act === "retry-mon") loadMon();
    else if (act === "tday") { state.travelDay = +b.dataset.i; render(); }
  });
  $("tabs").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-view]");
    if (b) setView(b.dataset.view);
  });

  /* ---------- toggles ---------- */
  function setView(v) {
    if (!VIEWS.includes(v)) return;
    state.view = v;
    store.set("view", v);
    render();
    ensureData();
    renderNotify();
  }
  function setUnit(u) { state.unit = u; store.set("unit", u); render(); }
  function setLang(l) {
    if (!LANG_META.some((x) => x.code === l)) return;
    state.lang = l;
    store.set("lang", l);
    stopSpeak();
    applyLang();
    hideResults();
    render();
    renderNotify();
  }
  $("u-C").addEventListener("click", () => setUnit("C"));
  $("u-F").addEventListener("click", () => setUnit("F"));
  $("lang").innerHTML = LANG_META.map((l) => `<option value="${l.code}" lang="${l.code}">${esc(l.name)}</option>`).join("");
  $("lang").value = state.lang;
  $("lang").addEventListener("change", (e) => setLang(e.target.value));

  /* ---------- watchlist and notifications ---------- */
  const MAX_WATCH = 5;
  const alertId = (p, a) => key(p) + "|" + a.type + "|" + a.date + "|" + a.level;
  const slim = (p) => ({ id: p.id, st: p.st, name: p.name, sub: p.sub, lat: p.lat, lon: p.lon, here: p.here });
  const watch = { status: {}, last: 0, busy: false };
  let swReg = null;

  const getWatch = () => store.get("watch", []).map(norm);
  const isWatched = (p) => getWatch().some((x) => key(x) === key(p));
  const notifSupported = () => typeof window !== "undefined" && "Notification" in window;
  const notifOn = () => store.get("notify", false) === true && notifSupported() && Notification.permission === "granted";
  const minLevel = () => { const v = Number(store.get("minLevel", 2)); return v >= 1 && v <= 3 ? v : 2; };

  async function registerSW() {
    if (!("serviceWorker" in navigator) || location.protocol === "file:") return;
    try { swReg = await navigator.serviceWorker.register("sw.js"); } catch (e) { swReg = null; }
  }

  /* Phones need the service worker to show a notification; desktop browsers can also use the page itself. */
  async function showNote(title, opts) {
    try {
      if ("serviceWorker" in navigator && location.protocol !== "file:") {
        const reg = swReg || (await navigator.serviceWorker.getRegistration());
        if (reg) { await reg.showNotification(title, opts); return true; }
      }
    } catch (e) { /* fall back to a page notification */ }
    try {
      const n = new Notification(title, opts);
      n.onclick = () => { window.focus(); n.close(); };
      return true;
    } catch (e) { return false; }
  }

  function notifyAlert(place, a) {
    const title = `${lvlName(a.level)} · ${alertTitle(a)} · ${placeName(place)}`;
    const body = `${whenLabel(a)}. ${alertDetail(a)} ${t("alTip." + a.type)}`;
    return showNote(title, { body, tag: alertId(place, a), requireInteraction: a.level === 3, vibrate: [200, 100, 200] });
  }

  function markKnown(place, alerts) {
    if (!alerts) return;
    const known = store.get("notified", {});
    const now = Date.now();
    alerts.forEach((a) => { if (a.level >= minLevel()) known[alertId(place, a)] = now; });
    store.set("notified", known);
  }

  /* silent = record what exists now without notifying (used right after switching on). */
  async function checkWatch(silent) {
    const list = getWatch();
    if (!list.length) { renderNotify(); return; }
    if (watch.busy) return;
    watch.busy = true;
    renderNotify();
    const results = await Promise.all(list.map(async (p) => {
      try { const { w, air } = await fetchWeather(p); return { p, alerts: computeAlerts(w, air) }; }
      catch (e) { return { p, alerts: null }; }
    }));
    const now = Date.now();
    const active = notifOn();
    const known = store.get("notified", {});
    Object.keys(known).forEach((k) => { if (now - known[k] > 3 * 864e5) delete known[k]; });
    const fresh = [];
    for (const { p, alerts } of results) {
      watch.status[key(p)] = { alerts, at: now };
      if (!alerts || !active) continue;
      for (const a of alerts) {
        const id = alertId(p, a);
        if (a.level < minLevel() || known[id]) continue;
        known[id] = now;
        fresh.push({ p, a });
      }
    }
    store.set("notified", known);
    watch.last = now;
    watch.busy = false;
    if (active && !silent) {
      fresh.sort((x, y) => y.a.level - x.a.level);
      for (const f of fresh.slice(0, 3)) await notifyAlert(f.p, f.a);
      if (fresh.length > 3) await showNote(t("moreAlerts", { n: fresh.length - 3 }), { body: t("openApp"), tag: "mausam-more" });
    }
    renderNotify();
  }

  function toggleWatch(p) {
    let list = getWatch();
    if (isWatched(p)) {
      list = list.filter((x) => key(x) !== key(p));
    } else if (list.length < MAX_WATCH) {
      list.push(slim(p));
      if (p === state.place && state.status === "ready") {
        watch.status[key(p)] = { alerts: state.alerts, at: Date.now() };
        if (notifOn()) markKnown(p, state.alerts);
      }
    }
    store.set("watch", list);
    renderNotify();
  }

  async function setNotify(on) {
    if (!on) { store.set("notify", false); renderNotify(); return; }
    if (!notifSupported()) { renderNotify(); return; }
    let perm = Notification.permission;
    if (perm === "default") {
      try { perm = await Notification.requestPermission(); } catch (e) { perm = "denied"; }
    }
    if (perm !== "granted") { store.set("notify", false); renderNotify(); return; }
    store.set("notify", true);
    if (!getWatch().length && state.place) toggleWatch(state.place);
    await checkWatch(true);
  }

  function renderNotify() {
    const el = $("notify-card");
    if (!el) return;
    const list = getWatch();
    const supported = notifSupported();
    const on = notifOn();
    const msg = !supported ? t("notifUnsupported") : Notification.permission === "denied" ? t("notifBlocked") : on ? t("notifOn") : t("notifOff");
    const cur = state.place;
    const curWatched = cur ? isWatched(cur) : false;

    const rows = list.map((p, i) => {
      const st = watch.status[key(p)];
      let status;
      if (!st) status = `<span class="w-status">${esc(t("watchChecking"))}</span>`;
      else if (!st.alerts) status = `<span class="w-status">${esc(t("watchFail"))}</span>`;
      else if (!st.alerts.length) status = `<span class="w-status">${esc(t("watchNone"))}</span>`;
      else {
        const a = st.alerts[0];
        status = `<span class="sev s l${a.level}">${esc(lvlName(a.level))}</span> <span class="w-status">${esc(alertTitle(a))} · ${esc(whenLabel(a))}${st.alerts.length > 1 ? ` (+${st.alerts.length - 1})` : ""}</span>`;
      }
      return `<li class="w-row"><div><button type="button" class="w-name" data-act="go" data-i="${i}">${esc(placeName(p))}</button>${placeSub(p) ? `<span class="w-sub">${esc(placeSub(p))}</span>` : ""}<div>${status}</div></div>` +
        `<button type="button" class="btn-sm" data-act="rm" data-i="${i}" aria-label="${esc(t("watchRemove"))}: ${esc(placeName(p))}">${esc(t("watchRemove"))}</button></li>`;
    }).join("");

    const actions = [];
    if (cur && !curWatched && list.length < MAX_WATCH) actions.push(`<button type="button" class="btn-sm" data-act="add">${esc(t("watchAdd", { name: placeName(cur) }))}</button>`);
    if (list.length) actions.push(`<button type="button" class="btn-sm" data-act="check">${esc(t("checkNow"))}</button>`);
    if (on) actions.push(`<button type="button" class="btn-sm" data-act="test">${esc(t("testBtn"))}</button>`);

    const when = watch.busy ? t("watchChecking") : watch.last ? `${t("lastChecked")} ${fmtTime(watch.last)} IST. ` : "";

    el.innerHTML =
      `<h2>${esc(t("notifTitle"))}</h2>` +
      `<div class="nrow"><label class="switch"><input type="checkbox" id="n-switch" role="switch" aria-describedby="n-msg"${on ? " checked" : ""}${supported ? "" : " disabled"}><span>${esc(t("notifSwitch"))}</span></label><span class="n-msg" id="n-msg">${esc(msg)}</span></div>` +
      `<div class="nrow"><label for="n-level">${esc(t("notifMin"))}</label><select id="n-level" class="select">${[0, 1, 2].map((i) => `<option value="${i + 1}"${minLevel() === i + 1 ? " selected" : ""}>${esc(t("lvlOpt." + i))}</option>`).join("")}</select></div>` +
      `<h3 class="n-sub">${esc(t("watchTitle"))}</h3>` +
      (list.length ? `<ul class="watch">${rows}</ul>` : `<p class="n-empty">${esc(t("watchEmpty"))}</p>`) +
      (cur && !curWatched && list.length >= MAX_WATCH ? `<p class="n-empty">${esc(t("watchFull"))}</p>` : "") +
      (actions.length ? `<div class="n-actions">${actions.join("")}</div>` : "") +
      `<p class="n-foot">${esc(when)}${esc(t("checkEvery"))} ${esc(t("notifNote"))}</p>`;

    el.onclick = (e) => {
      const b = e.target.closest("button[data-act]");
      if (!b) return;
      const act = b.dataset.act, i = Number(b.dataset.i);
      if (act === "go") pick(list[i]);
      else if (act === "rm") toggleWatch(list[i]);
      else if (act === "add") toggleWatch(state.place);
      else if (act === "check") checkWatch(false);
      else if (act === "test") {
        showNote(t("testTitle"), { body: t("testBody"), tag: "mausam-test" }).then((ok) => { if (!ok) notify(t("testFail")); });
      }
    };
    el.onchange = (e) => {
      if (e.target.id === "n-switch") setNotify(e.target.checked);
      else if (e.target.id === "n-level") store.set("minLevel", Number(e.target.value));
    };
  }

  /* ---------- start ---------- */
  applyLang();
  renderTabs();
  renderNotify();
  registerSW();
  load(norm(store.get("last", null)) || CITIES[0]);
  checkWatch(false);
  setInterval(() => checkWatch(false), 30 * 60 * 1000);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && Date.now() - watch.last > 10 * 60 * 1000) checkWatch(false);
  });
  window.addEventListener("online", () => { if (state.stale && state.place) load(state.place); });

  if (typeof globalThis !== "undefined" && globalThis.__MAUSAM_TEST__) {
    globalThis.__MAUSAM_TEST__.api = { analyzeAir, subIndex, computeAlerts, sprayWindows, irrigation, travelDays, monsoonStats, landmarkFor, state };
  }
})();

</script>
</body>
</html>
